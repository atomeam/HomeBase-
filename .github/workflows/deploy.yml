name: deploy-pipeline

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  prepare-deploy-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy authority check
        run: npm run deploy:check

      - name: Package artifact
        run: tar -czf homebase-dist.tgz dist package.json README.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: homebase-dist
          path: homebase-dist.tgz

  operator-handoff:
    runs-on: ubuntu-latest
    needs: [prepare-deploy-artifact]
    steps:
      - name: Deployment gate
        run: |
          echo "Deployment is operator-gated."
          echo "No direct deploy credentials are configured in this workflow."
